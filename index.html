  <meta name="description" content="Curate your favorite YouTube channels, browse what other engineers watch, and discover new content through shared interests and match scores">
  <meta property="og:title" content="TubeStack: YouTube Channel Discovery for Engineers">
  <meta property="og:description" content="Curate your favorite YouTube channels, browse what other engineers watch, and discover new content through match scores">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tubestack.neorgon.com/">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TubeStack: YouTube Channel Discovery for Engineers">
  <meta name="twitter:description" content="Curate your favorite YouTube channels and discover new content through match scores">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://tubestack.neorgon.com/">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#040714">
  <meta property="og:image" content="https://tubestack.neorgon.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://tubestack.neorgon.com/og-preview.jpg">
  <link rel="icon" type="image/x-icon" href="https://cdn.neorgon.org/v1.0.0/favicon.ico" />
  <link rel="stylesheet" href="css/style.css">
  <!-- Neorgon Header Kit (vendored; ?header=live swaps CSS to CDN) -->
  <script>(function(){var m=location.search.match(/[?&]theme=([\w-]+)/)||document.cookie.match(/(?:^|;\s*)neo_theme=([\w-]+)/);if(m&&m[1]!=='default')document.documentElement.dataset.theme=decodeURIComponent(m[1]);})();</script>
  <link rel="stylesheet" href="css/neorgon-header.css">
  <link rel="stylesheet" href="css/neorgon-themes.css">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/header/season.css">
  <script defer src="js/neorgon-header.js"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "TubeStack",
    "description": "YouTube channel discovery platform for engineers. Curate stacks, browse peers, find channels through match scores",
    "url": "https://tubestack.neorgon.com/",
    "applicationCategory": "SocialNetworkingApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar" data-header-mode="app">
    <div class="header-logo">
      <a href="https://neorgon.com/" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.neorgon.org/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="Neorgon home">
      </a>
      <a href="#feed" class="header-title-link">
        <h1>TubeStack</h1>
        <div class="header-subtitle">YouTube channels engineers watch</div>
      </a>
    </div>

    <div class="header-right">
      <nav class="header-actions">
        <button data-keep-mobile class="nav-link active" data-view="feed" title="Feed (1)">Feed</button>
        <button class="nav-link" data-view="explore" title="Explore (2)">Explore</button>
        <button class="nav-link" data-view="stack" title="My Stack (3)">My Stack</button>
    
      </nav>
      <button type="button" class="auth-toggle" data-keep-mobile id="authToggle" aria-label="Account">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="10" r="3"/>
      <path d="M6 19c1.2-3 3.5-4 6-4s4.8 1 6 4"/>
      </svg>
      <span class="rec-badge" id="recBadge" hidden></span>
      </button>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      </a>
    </div>
  </header>

  <div class="auth-panel" id="authPanel">
    <div class="auth-panel-inner">
      <div id="authGate">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Log In</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>
        <div class="auth-form" id="authLoginForm">
          <input type="text" id="authLoginUser" placeholder="Username" autocomplete="username" maxlength="20">
          <input type="password" id="authLoginPass" placeholder="Password" autocomplete="current-password">
          <button class="auth-submit" id="authLoginBtn">Log In</button>
        </div>
        <div class="auth-form" id="authRegisterForm" hidden>
          <input type="text" id="authRegUser" placeholder="Choose a username" autocomplete="username" maxlength="20">
          <input type="password" id="authRegPass" placeholder="Choose a password" autocomplete="new-password">
          <input type="text" id="authRegBio" placeholder="Short bio (optional)" maxlength="100">
          <button class="auth-submit" id="authRegBtn">Register</button>
        </div>
      </div>
      <div id="authUser" hidden>
        <span class="auth-username" id="authUsername"></span>
        <button class="auth-logout" id="authLogout">Log out</button>
      </div>
    </div>
  </div>
  <div class="auth-divider"></div>

  <main id="main">
    <div class="container" id="app"></div>
  </main>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-panel">
      <div class="search-header">
        <input type="text" id="searchInput" placeholder="Search YouTube channels..." autocomplete="off">
        <button class="search-close" id="searchClose" type="button" aria-label="Close search">&times;</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Recommend overlay -->
  <div class="search-overlay" id="recommendOverlay" hidden>
    <div class="search-panel recommend-panel">
      <div class="search-header">
        <h3 class="recommend-title">Recommend Channel</h3>
        <button class="search-close" id="recommendClose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="recommend-body" id="recommendBody"></div>
    </div>
  </div>

  <footer class="info-footer">
    Part of <a class="footer-link" href="https://neorgon.com/">Neorgon</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
